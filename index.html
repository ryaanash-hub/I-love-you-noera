<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  cursor: pointer;
}

hr {
  margin: 40px 0;
}
</style>
</head>

<body>

<h1>I love you Noera ❤️</h1>
<p>I made this just for you...</p>

<button onclick="showMessage()">Click me</button>

<p id="message" style="display:none;">
I’m really sorry for hurting you.<br>
You mean so much to me and I want to do better.<br>
I love you ❤️
</p>

<hr>

<h2>Catch the hearts ❤️</h2>
<p>Score: <span id="score">0</span></p>
<div id="gameArea" style="position:relative; height:300px; border:1px solid white;"></div>

<hr>

<h2>Do you forgive me? 🥺</h2>
<button onclick="yes()">Yes</button>
<button id="noBtn" onmouseover="moveNo()">No</button>
<p id="result"></p>

<hr>

<h2>Why I love you ❤️</h2>
<p>
- Your smile<br>
- The way you talk<br>
- Everything about you
</p>

<script>

// message
function showMessage() {
  document.getElementById("message").style.display = "block";
}

// game
let score = 0;

function spawnHeart() {
  let heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.style.position = "absolute";
  heart.style.left = Math.random() * 90 + "%";
  heart.style.top = "0px";
  heart.style.cursor = "pointer";

  heart.onclick = () => {
    score++;
    document.getElementById("score").innerText = score;
    heart.remove();
  };

  document.getElementById("gameArea").appendChild(heart);

  let fall = setInterval(() => {
    let top = parseInt(heart.style.top);
    heart.style.top = top + 5 + "px";

    if (top > 280) {
      heart.remove();
      clearInterval(fall);
    }
  }, 50);
}

setInterval(spawnHeart, 1000);

// forgive buttons
function yes() {
  document.getElementById("result").innerText = "I love you ❤️";
}

function moveNo() {
  let btn = document.getElementById("noBtn");
  btn.style.position = "absolute";
  btn.style.left = Math.random() * 80 + "%";
  btn.style.top = Math.random() * 80 + "%";
}

</script>

</body>
</html>
