<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 50px;
}
button {
  padding: 15px;
  font-size: 16px;
  background: pink;
  border: none;
  border-radius: 10px;
}

  display: none;
  margin-top: 20px;
}
</style>
</head>
<body>

<h1>I love you Noera ❤️</h1>
<p>I made this just for you...</p>

<button onclick="show()">Click me</button>

<p id="msg">
I love you Noera, I'm sorry I made you upset and I'm especially sorry about how I handled everything.  
You mean so much to me and I want to do better.  
I love you so much ❤️
</p>

<script>
function show() {
  document.getElementById("msg").style.display = "block";
}
</script>

</body>
</html>
