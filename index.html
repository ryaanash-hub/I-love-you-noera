<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  background: linear-gradient(135deg, #ffb6c1, #c2dab8);
  font-family: Arial;
  text-align: center;
  overflow-x: hidden;
  transition:0.5s;
}

button {
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
  background:#ffb6c1;
  cursor:pointer;
}

/* LOCK SCREEN */
#lockScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

/* HEART TRAIL */
.trail {
  position:fixed;
  pointer-events:none;
  animation:fade 1s forwards;
}
@keyframes fade { to {opacity:0; transform:translateY(-20px);} }

/* PETALS */
.petal {
  position:fixed;
  top:-10px;
  animation:fall linear forwards;
}
@keyframes fall {
  to { transform:translateY(100vh); opacity:0; }
}

/* POPUP */
.popup {
  position:absolute;
  animation:fadeUp 1.5s forwards;
}
@keyframes fadeUp {
  to { opacity:0; transform:translateY(-30px); }
}

/* CINEMATIC */
#cinema {
 position:fixed;
 top:0; left:0;
 width:100%; height:100%;
 background:black;
 color:white;
 display:none;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:999;
 font-size:22px;
 padding:20px;
}

#holdMsg { opacity:0; transition:2s; }

</style>
</head>

<body>

<!-- 🔐 LOCK -->
<div id="lockScreen">
<h2>You cannot pass until you enter the name of the love of my lifes fortnite username 🎮❤️</h2>
<input id="passwordInput">
<button onclick="checkPassword()">Enter</button>
<p id="wrongMsg"></p>
</div>

<h1>I love you Noera ❤️</h1>
<h2 id="loveTimer"></h2>
<p id="returnMsg"></p>

<button onclick="startTyping()">Click me</button>
<p id="poem"></p>

<hr>

<h2>Catch the hearts ❤️</h2>
<p>Score: <span id="score">0</span></p>
<div id="gameArea" style="height:300px; position:relative;"></div>

<audio id="winSound" src="love.mp3"></audio>

<hr>

<h2>Does Ryaan love Noera? ❤️</h2>
<button onclick="yes()">Yes obviously</button>
<button id="noBtn" onmouseover="moveNo()">No</button>
<p id="result"></p>

<hr>

<button id="holdBtn">Hold me</button>
<p id="holdMsg">IM GONNA HOLD ON TO YOU JUST LIKE THIS ❤️</p>

<hr>

<h2>Secret 👀</h2>
<input id="code">
<button onclick="checkCode()">Unlock</button>
<div id="secretBox" style="display:none;">
<p>HEHE , you guessed It , your always gonna be my sketchy kid ❤️</p>
<img src="secret.jpg" width="200">
</div>

<div id="cinema">
  <div id="cinemaText"></div>
  <button onclick="closeCinema()">⬅ Back</button>
</div>

<script>

// 🔐 PASSWORD
function checkPassword(){
 let input=passwordInput.value;

 if(input==="ussyflower"){
   lockScreen.style.display="none";

   if(localStorage.getItem("visited")){
     returnMsg.innerText="You came back… I was hoping you would ❤️";
   } else {
     returnMsg.innerText="Hi… this is all for you ❤️";
     localStorage.setItem("visited","true");
   }

 } else {
   wrongMsg.innerText="Nope 😏";
 }
}

// 🕰️ TIMER
setInterval(()=>{
 let start=new Date("2025-10-09");
 let now=new Date();
 let diff=now-start;
 let days=Math.floor(diff/(1000*60*60*24));
 loveTimer.innerText=
 "I've loved you for "+days+" days ❤️\nSince the day I spoke to you hehe";
},1000);

// ✍️ TYPEWRITER
function startTyping(){
 poem.innerText="Schone Noera...";
}

// 💖 HEART TRAIL
document.addEventListener("mousemove", e=>{
 let h=document.createElement("div");
 h.className="trail";
 h.innerHTML="❤️";
 h.style.left=e.pageX+"px";
 h.style.top=e.pageY+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),1000);
});

// 🌸 PETALS
setInterval(()=>{
 let p=document.createElement("div");
 p.className="petal";
 p.innerHTML="🌸";
 p.style.left=Math.random()*100+"vw";
 p.style.animationDuration=(4+Math.random()*5)+"s";
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),8000);
},400);

// 🎮 GAME
let score=0;

function spawnHeart(){
 let h=document.createElement("div");
 h.innerHTML="❤️";
 h.style.position="absolute";
 h.style.left=Math.random()*90+"%";
 h.style.top="0px";

 h.onclick=()=>{
  score++;
  scoreSpan.innerText=score;

  let msgs=["I LOVE YOU NOERA ❤️","keep going ❤️","you got this ❤️"];
  let pop=document.createElement("div");
  pop.className="popup";
  pop.innerText=msgs[Math.floor(Math.random()*msgs.length)];
  pop.style.left=h.style.left;
  pop.style.top=h.style.top;
  gameArea.appendChild(pop);
  setTimeout(()=>pop.remove(),1000);

  h.remove();

  if(score===10){
    cinematic();
  }
 };

 gameArea.appendChild(h);

 let fall=setInterval(()=>{
  let t=parseInt(h.style.top);
  h.style.top=t+3+"px";
  if(t>280){h.remove();clearInterval(fall);}
 },50);
}
setInterval(spawnHeart,1200);

// 🎬 CINEMATIC
function cinematic(){
 winSound.play();
 cinema.style.display="flex";
 cinemaText.innerHTML="";

 let lines=["Hey...","I meant everything I said.","I love you."];
 let i=0;

 function next(){
  if(i<lines.length){
    cinemaText.innerHTML+="<br>"+lines[i];
    i++;
    setTimeout(next,2000);
  } else {
    showImages();
  }
 }
 next();
}

function showImages(){
 ["pic1.jpg","pic2.jpg","pic3.jpg"].forEach((src,i)=>{
  let img=document.createElement("img");
  img.src=src;
  img.width=150;
  img.style.opacity=0;
  img.style.transition="2s";
  cinemaText.appendChild(img);
  setTimeout(()=>img.style.opacity=1,1000*i);
 });
}

function closeCinema(){
 cinema.style.display="none";
 cinemaText.innerHTML="";
}

// ❌ NO BUTTON
let texts=["no","really?","you sure?","nah 😭"];
function moveNo(){
 noBtn.innerText=texts[Math.floor(Math.random()*texts.length)];
 noBtn.style.position="absolute";
 noBtn.style.left=Math.random()*80+"%";
 noBtn.style.top=Math.random()*80+"%";
}

// ✋ HOLD
let hold;
holdBtn.onmousedown=()=>{
 hold=setTimeout(()=>{ holdMsg.style.opacity=1; },1500);
}
holdBtn.onmouseup=()=>clearTimeout(hold);

// 🔐 SECRET
function checkCode(){
 if(code.value==="Sketchy"){
   secretBox.style.display="block";
 }
}

// YES
function yes(){ result.innerText="Of course I do ❤️"; }

</script>

</body>
</html>
