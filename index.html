<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  background: linear-gradient(135deg, #ffb6c1, #d9f2d9);
  font-family: Arial;
  text-align: center;
  overflow-x: hidden;
  transition:0.5s;
  color:#1a1a1a;
}

.dark { background:#0b0f1a; color:white; }

/* PARTICLES */
#particleCanvas{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 z-index:0;
 pointer-events:none;
}

/* BUTTONS */
button{
 padding:10px;
 margin:10px;
 border-radius:10px;
 border:none;
 background:#ffb6c1;
 cursor:pointer;
}

/* HEART TRAIL */
.trail{
 position:fixed;
 pointer-events:none;
 animation:fade 1s forwards;
}
@keyframes fade{
 to{opacity:0; transform:translateY(-20px);}
}

/* PETALS */
.petal{
 position:fixed;
 top:-10px;
 animation:fall linear forwards;
}
@keyframes fall{
 to{transform:translateY(100vh); opacity:0;}
}

/* POPUP */
.popup{
 position:absolute;
 color:#66bb6a;
 font-weight:bold;
 animation:fadeUp 1.2s forwards;
}
@keyframes fadeUp{
 to{opacity:0; transform:translateY(-25px);}
}

/* CINEMATIC */
#cinema{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:black;
 color:white;
 display:none;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:999;
}

/* REAL GAME */
#realGame{
 border:2px solid #66bb6a;
 margin-top:20px;
 background:white;
}
.dark #realGame{background:#111;}
</style>
</head>

<body>

<canvas id="particleCanvas"></canvas>

<button onclick="toggleDark()">🌙 Night Mode</button>

<div id="lockScreen">
<h2>Enter the love of my life's Fortnite username 🎮❤️</h2>
<input id="passwordInput">
<button onclick="checkPassword()">Enter</button>
<p id="wrongMsg"></p>
</div>

<h1>I love you Noera ❤️</h1>
<h2 id="loveTimer"></h2>
<p id="returnMsg"></p>

<button onclick="startTyping()">Click me</button>
<p id="poem"></p>

<hr>

<h2>Catch the hearts ❤️</h2>
<p>Level: <span id="level">1</span> | Score: <span id="score">0</span></p>
<div id="gameArea" style="height:300px; position:relative;"></div>

<audio id="winSound" src="love.mp3"></audio>

<hr>

<h2>Control the heart ❤️</h2>
<canvas id="realGame" width="400" height="300"></canvas>

<hr>

<script>

// DARK MODE
function toggleDark(){document.body.classList.toggle("dark");}

// PASSWORD
function checkPassword(){
 if(passwordInput.value==="ussyflower"){
  lockScreen.style.display="none";
 } else { wrongMsg.innerText="Nope 😏"; }
}

// TIMER
setInterval(()=>{
 let start=new Date("2025-10-09");
 let now=new Date();
 let d=Math.floor((now-start)/(1000*60*60*24));
 loveTimer.innerText=d+" days ❤️";
},1000);

// POEM
let poemText="Schone Noera...";
function startTyping(){
 let i=0;
 poem.innerHTML="";
 let int=setInterval(()=>{
  poem.innerHTML+=poemText[i]||"";
  i++;
  if(i>=poemText.length) clearInterval(int);
 },30);
}

// HEART TRAIL
document.addEventListener("mousemove", e=>{
 let h=document.createElement("div");
 h.className="trail";
 h.innerHTML="❤️";
 h.style.left=e.pageX+"px";
 h.style.top=e.pageY+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),1000);
});

// PARTICLES
const pc=document.getElementById("particleCanvas");
const pctx=pc.getContext("2d");
pc.width=window.innerWidth;
pc.height=window.innerHeight;

let particles=[];
for(let i=0;i<200;i++){
 particles.push({
  x:Math.random()*pc.width,
  y:Math.random()*pc.height,
  vx:(Math.random()-0.5)*1.5,
  vy:(Math.random()-0.5)*1.5
 });
}

let mouse={x:0,y:0};
document.addEventListener("mousemove",e=>{
 mouse.x=e.clientX;
 mouse.y=e.clientY;
});

function drawParticles(){
 pctx.clearRect(0,0,pc.width,pc.height);
 particles.forEach(p=>{
  let dx=mouse.x-p.x;
  let dy=mouse.y-p.y;
  let dist=Math.sqrt(dx*dx+dy*dy);

  if(dist<120){
   p.x-=dx*0.02;
   p.y-=dy*0.02;
  }

  p.x+=p.vx;
  p.y+=p.vy;

  pctx.fillStyle="pink";
  pctx.beginPath();
  pctx.arc(p.x,p.y,2,0,Math.PI*2);
  pctx.fill();
 });
 requestAnimationFrame(drawParticles);
}
drawParticles();

// ORIGINAL GAME
let score=0, level=1;
function spawnHeart(){
 let h=document.createElement("div");
 h.innerHTML="❤️";
 h.style.position="absolute";
 h.style.left=Math.random()*90+"%";
 h.style.top="0px";

 h.onclick=()=>{
  score++;
  document.getElementById("score").innerText=score;

  let pop=document.createElement("div");
  pop.className="popup";
  pop.innerText="WELL DONE NOERA ❤️";
  pop.style.left=h.style.left;
  pop.style.top=h.style.top;
  gameArea.appendChild(pop);
  setTimeout(()=>pop.remove(),1000);

  if(score===10){alert("I love you ❤️");}

  h.remove();
 };

 gameArea.appendChild(h);

 let fall=setInterval(()=>{
  let t=parseInt(h.style.top);
  h.style.top=t+3+"px";
  if(t>280){h.remove();clearInterval(fall);}
 },50);
}
setInterval(spawnHeart,1200);

// REAL GAME
const g=document.getElementById("realGame");
const gctx=g.getContext("2d");

let player={x:200,y:150};
let items=[];
let keys={};

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function spawnItem(){
 items.push({x:Math.random()*380,y:Math.random()*280});
}
setInterval(spawnItem,1500);

function update(){
 if(keys["ArrowUp"]) player.y-=3;
 if(keys["ArrowDown"]) player.y+=3;
 if(keys["ArrowLeft"]) player.x-=3;
 if(keys["ArrowRight"]) player.x+=3;

 items.forEach((it,i)=>{
  let dx=player.x-it.x;
  let dy=player.y-it.y;
  if(Math.sqrt(dx*dx+dy*dy)<15){
   items.splice(i,1);
  }
 });
}

function draw(){
 gctx.clearRect(0,0,400,300);

 gctx.fillStyle="red";
 gctx.beginPath();
 gctx.arc(player.x,player.y,10,0,Math.PI*2);
 gctx.fill();

 items.forEach(it=>{
  gctx.fillText("❤️",it.x,it.y);
 });
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
