<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  background: linear-gradient(135deg, #ffb6c1, #c2dab8);
  font-family: Arial;
  text-align: center;
  overflow-x: hidden;
  transition: 0.5s;
}

.dark { background:#0b0f1a; color:white; }

button {
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
  background:#ffb6c1;
}

/* FOLLOW HEARTS */
.trail {
  position: fixed;
  pointer-events:none;
  animation: fade 1s forwards;
}
@keyframes fade {
  to { opacity:0; transform: translateY(-20px); }
}

/* CINEMATIC */
#cinema {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:24px;
  z-index:999;
  text-align:center;
}

/* SECRET */
#secretBox { display:none; margin-top:20px; }

.fade-img { opacity:0; transition:2s; }
.show { opacity:1; }

</style>
</head>

<body>

<button onclick="toggleDark()">🌙 Night Mode</button>

<h1>I love you Noera ❤️</h1>
<h2 id="loveTimer"></h2>

<button onclick="startTyping()">Click me</button>
<p id="poem"></p>

<hr>

<h2>Catch the hearts ❤️</h2>
<p>Level: <span id="level">1</span> | Score: <span id="score">0</span></p>
<div id="gameArea" style="height:300px; position:relative;"></div>

<div id="reward" style="display:none;">
  <h2>You unlocked something ❤️</h2>
  <p>I love you noera ❤️</p>
  <img src="pic1.jpg" width="150" class="fade-img" id="i1">
</div>

<audio id="winSound" src="love.mp3"></audio>

<hr>

<h2>Secret 👀</h2>
<input id="code" placeholder="enter password">
<button onclick="checkCode()">Unlock</button>

<div id="secretBox">
  <p>HEHE , you guessed It , your always gonna be my sketchy kid :)  
  AND ILL ALWAYS FOREVER AND EVER be NOERAS weatherboy ❤️</p>
  <img src="secret.jpg" width="200">
</div>

<div id="cinema">
  <div id="cinemaText"></div>
</div>

<script>

// DARK
function toggleDark(){ document.body.classList.toggle("dark"); }

// TIMER
function updateLoveTimer(){
 let start=new Date("2025-10-09");
 let now=new Date();
 let days=Math.floor((now-start)/(1000*60*60*24));
 loveTimer.innerText="I've loved you for "+days+" days ❤️\nSince the day I spoke to you hehe";
}
setInterval(updateLoveTimer,1000);
updateLoveTimer();

// TYPEWRITER
let txt="Schone Noera...";
function startTyping(){
 let i=0;
 poem.innerHTML="";
 let int=setInterval(()=>{
  poem.innerHTML+=txt[i]||"";
  i++;
  if(i>=txt.length) clearInterval(int);
 },30);
}

// FOLLOW HEARTS
document.addEventListener("mousemove", e=>{
 let h=document.createElement("div");
 h.className="trail";
 h.innerHTML="❤️";
 h.style.left=e.pageX+"px";
 h.style.top=e.pageY+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),1000);
});

// GAME
let score=0, level=1;

function spawnHeart(){
 let h=document.createElement("div");
 h.innerHTML="❤️";
 h.style.position="absolute";
 h.style.left=Math.random()*90+"%";
 h.style.top="0px";

 h.onclick=()=>{
  score++;
  scoreSpan.innerText=score;

  if(score%5==0){
    level++;
    levelSpan.innerText=level;
  }

  h.remove();

  if(score==15){
    win();
  }
 };

 gameArea.appendChild(h);

 let speed=5+level*2;

 let fall=setInterval(()=>{
  let t=parseInt(h.style.top);
  h.style.top=t+speed+"px";
  if(t>280){h.remove();clearInterval(fall);}
 },50);
}

setInterval(spawnHeart,1000);

function win(){
 winSound.play();
 reward.style.display="block";
 setTimeout(()=>i1.classList.add("show"),500);

 // CINEMATIC
 cinema.style.display="flex";
 cinemaText.innerHTML="Hey...<br><br>I meant everything I said.<br><br>I love you.";
}

// SECRET
function checkCode(){
 if(code.value==="Sketchy"){
   secretBox.style.display="block";
 } else {
   alert("wrong 😏");
 }
}

</script>

</body>
</html>
