<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  background: linear-gradient(135deg, #ffb6c1, #c2dab8);
  font-family: Arial;
  text-align: center;
  overflow-x: hidden;
  transition: 0.5s;
  color:#1a1a1a;
}

.dark {
  background:#0b0f1a;
  color:white;
}

/* BUTTONS */
button {
  padding:10px;
  margin:10px;
  border-radius:10px;
  border:none;
  background:#ffb6c1;
  cursor:pointer;
}

.dark button {
  background:#1f2937;
  color:white;
  box-shadow:0 0 10px #c2dab8;
}

/* GREEN ACCENTS */
h1,h2 {
  color:#2e7d32;
}

.dark h1,.dark h2 {
  color:#8ef5b3;
}

/* LOCK */
#lockScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

/* HEART TRAIL */
.trail {
  position:fixed;
  pointer-events:none;
  font-size:18px;
  animation:fade 1s forwards;
}

.dark .trail {
  text-shadow:0 0 10px pink;
}

@keyframes fade {
  to {opacity:0; transform:translateY(-20px);}
}

/* PETALS */
.petal {
  position:fixed;
  top:-10px;
  animation:fall linear forwards;
}

@keyframes fall {
  to { transform:translateY(100vh); opacity:0;}
}

/* POPUP */
.popup {
  position:absolute;
  color:#2e7d32;
  font-weight:bold;
  animation:fadeUp 1.2s forwards;
}

@keyframes fadeUp {
  to {opacity:0; transform:translateY(-25px);}
}

/* CINEMATIC */
#cinema {
 position:fixed;
 top:0; left:0;
 width:100%; height:100%;
 background:black;
 color:white;
 display:none;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:999;
 padding:20px;
}

#cinemaText {
  max-width:600px;
  line-height:1.6;
}

#imageRow {
  display:flex;
  gap:20px;
  margin-top:20px;
}

.cineImg {
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:15px;
  opacity:0;
  transition:1.5s;
}

/* HOLD */
#holdMsg {
  opacity:0;
  transition:2s;
  color:#2e7d32;
}

/* TIMER */
#loveTimer {
  font-size:18px;
  margin-bottom:10px;
}

</style>
</head>

<body>

<button onclick="toggleDark()">🌙 Night Mode</button>

<div id="lockScreen">
<h2>Enter the love of my life's Fortnite username 🎮❤️</h2>
<input id="passwordInput">
<button onclick="checkPassword()">Enter</button>
<p id="wrongMsg"></p>
</div>

<h1>I love you Noera ❤️</h1>
<h2 id="loveTimer"></h2>
<p id="returnMsg"></p>

<button onclick="startTyping()">Click me</button>
<p id="poem"></p>

<hr>

<h2>Catch the hearts ❤️</h2>
<p>Score: <span id="score">0</span></p>
<div id="gameArea" style="height:300px; position:relative;"></div>

<audio id="winSound" src="love.mp3"></audio>

<hr>

<h2>Does Ryaan love Noera? ❤️</h2>
<button onclick="yes()">Yes</button>
<button id="noBtn" onmouseover="moveNo()">No</button>
<p id="result"></p>

<hr>

<button id="holdBtn">Hold me</button>
<p id="holdMsg">IM GONNA HOLD ON TO YOU JUST LIKE THIS ❤️</p>

<hr>

<h2>Secret 👀</h2>
<input id="code">
<button onclick="checkCode()">Unlock</button>

<div id="secretBox" style="display:none;">
<p>HEHE , you guessed it , your ALWAYS gonna be my sketchy kid and I will ALWAYS be Noeras weatherboy ❤️</p>
<img src="secret.jpg" width="200">
</div>

<div id="cinema">
<div id="cinemaText"></div>

<div id="imageRow"></div>

<button onclick="closeCinema()">⬅ Back</button>
</div>

<script>

// DARK MODE
function toggleDark(){
 document.body.classList.toggle("dark");
}

// PASSWORD
function checkPassword(){
 if(passwordInput.value==="ussyflower"){
  lockScreen.style.display="none";

  if(localStorage.getItem("visited")){
    returnMsg.innerText="You came back… I was hoping you would ❤️";
  } else {
    returnMsg.innerText="Hi… this is all for you ❤️";
    localStorage.setItem("visited","true");
  }

 } else {
  wrongMsg.innerText="Nope 😏";
 }
}

// TIMER FULL
setInterval(()=>{
 let start=new Date("2025-10-09");
 let now=new Date();
 let diff=now-start;

 let d=Math.floor(diff/(1000*60*60*24));
 let h=Math.floor((diff/(1000*60*60))%24);
 let m=Math.floor((diff/(1000*60))%60);
 let s=Math.floor((diff/1000)%60);

 loveTimer.innerText =
 `${d}d ${h}h ${m}m ${s}s ❤️\nSince the day I spoke to you hehe`;
},1000);

// POEM
let poemText=`Schone Noera,
licht dat mijn stille hart doet ontwaken...`;

function startTyping(){
 let i=0;
 poem.innerHTML="";
 let int=setInterval(()=>{
  poem.innerHTML+=poemText[i]||"";
  i++;
  if(i>=poemText.length) clearInterval(int);
 },30);
}

// HEART TRAIL
let letters=["N","O","E","R","A"];
let index=0;

document.addEventListener("mousemove", e=>{
 let h=document.createElement("div");
 h.className="trail";
 h.innerText=letters[index];
 index=(index+1)%letters.length;

 h.style.left=e.pageX+"px";
 h.style.top=e.pageY+"px";

 document.body.appendChild(h);
 setTimeout(()=>h.remove(),1000);
});

// GAME
let score=0;

function spawnHeart(){
 let h=document.createElement("div");
 h.innerHTML="❤️";
 h.style.position="absolute";
 h.style.left=Math.random()*90+"%";
 h.style.top="0px";
 h.style.cursor="pointer";

 h.onclick=()=>{
  score++;
  document.getElementById("score").innerText=score;

  let pop=document.createElement("div");
  pop.className="popup";
  pop.innerText="I LOVE YOU NOERA ❤️";
  pop.style.left=h.style.left;
  pop.style.top=h.style.top;
  gameArea.appendChild(pop);

  setTimeout(()=>pop.remove(),1000);
  h.remove();

  if(score===10){
    cinematic();
  }
 };

 gameArea.appendChild(h);

 let fall=setInterval(()=>{
  let t=parseInt(h.style.top);
  h.style.top=t+3+"px";
  if(t>280){h.remove();clearInterval(fall);}
 },50);
}
setInterval(spawnHeart,1200);

// CINEMATIC FIXED
function cinematic(){
 winSound.play();
 cinema.style.display="flex";

 cinemaText.innerHTML="Hey...<br><br>I meant everything I said.<br><br>I love you.";

 let row=document.getElementById("imageRow");
 row.innerHTML="";

 ["pic1.jpg","pic2.jpg","pic3.jpg"].forEach((src,i)=>{
  let img=document.createElement("img");
  img.src=src;
  img.className="cineImg";
  row.appendChild(img);

  setTimeout(()=>img.style.opacity=1,800*i);
 });
}

// BACK
function closeCinema(){
 cinema.style.display="none";
}

// NO BUTTON
function moveNo(){
 noBtn.style.position="absolute";
 noBtn.style.left=Math.random()*80+"%";
 noBtn.style.top=Math.random()*80+"%";
}

// HOLD
let hold;
holdBtn.onmousedown=()=>{
 hold=setTimeout(()=>holdMsg.style.opacity=1,1500);
}
holdBtn.onmouseup=()=>clearTimeout(hold);

// SECRET
function checkCode(){
 if(code.value==="Sketchy"){
  secretBox.style.display="block";
 }
}

// YES
function yes(){
 result.innerText="Of course I do ❤️";
}

</script>

</body>
</html>
